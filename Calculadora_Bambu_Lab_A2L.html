<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b91c1c"><title>Calculadora Bambu Lab A2L</title><style>
body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:18px;color:#111827}main{max-width:760px;margin:auto}.card{background:#fff;padding:20px;border-radius:16px;border:1px solid #ddd}h1{margin:0 0 6px}.sub,.help,.note{color:#6b7280}.sub{margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:bold;font-size:13px;margin-bottom:5px}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:16px}.help{font-size:11px;margin-top:4px}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.result{padding:13px;background:#f9fafb;border:1px solid #ddd;border-radius:10px}.result span{font-size:12px;color:#6b7280}.result strong{display:block;font-size:20px;margin-top:4px}.profit{background:#fef2f2;border-color:#fecaca}.profit strong{color:#b91c1c}.actions{margin-top:16px;display:flex;gap:10px}button{padding:11px 15px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.primary{background:#b91c1c;color:white}.secondary{background:#ddd}.note{font-size:12px;margin-top:14px}@media(max-width:600px){.grid,.results{grid-template-columns:1fr 1fr}}@media(max-width:420px){.grid,.results{grid-template-columns:1fr}}</style></head><body><main><section class="card">
<h1>Calculadora Bambu Lab A2L</h1><div class="sub">Calcula coste, precio de venta y beneficio.</div>
<div class="grid">
<div><label>Filamento usado (g)</label><input id="g" type="number" value="25" min="0" step=".1"><div class="help">Peso de Bambu Studio.</div></div>
<div><label>Precio filamento (€/kg)</label><input id="kg" type="number" value="20" min="0" step=".01"></div>
<div><label>Tiempo de impresión (horas)</label><input id="h" type="number" value="2" min="0" step=".01"></div>
<div><label>Consumo medio A2L (W)</label><input id="w" type="number" value="130" min="0" step="1"><div class="help">Valor inicial: 130 W.</div></div>
<div><label>Electricidad (€/kWh)</label><input id="kwh" type="number" value=".20" min="0" step=".001"></div>
<div><label>Merma (%)</label><input id="merma" type="number" value="5" min="0" max="100" step=".1"></div>
<div><label>Otros gastos (€)</label><input id="otros" type="number" value="0" min="0" step=".01"></div>
<div><label>Precio de venta (€)</label><input id="venta" type="number" value="5" min="0" step=".01"></div></div>
<div class="results">
<div class="result"><span>Material</span><strong id="material">0,00 €</strong></div><div class="result"><span>Electricidad</span><strong id="electricidad">0,00 €</strong></div><div class="result"><span>Coste total</span><strong id="coste">0,00 €</strong></div><div class="result profit"><span>Beneficio</span><strong id="beneficio">0,00 €</strong></div><div class="result"><span>Margen</span><strong id="margen">0,0 %</strong></div><div class="result"><span>Coste por hora</span><strong id="hora">0,00 €/h</strong></div></div>
<div class="actions"><button class="primary" id="reset">Restablecer</button><button class="secondary" id="print">Imprimir / PDF</button></div>
<div class="note">Funciona sin internet. Puedes guardarla en el móvil y en el PC.</div>
</section></main><script>
const ids=["g","kg","h","w","kwh","merma","otros","venta"],$=x=>document.getElementById(x),e=n=>n.toLocaleString("es-ES",{style:"currency",currency:"EUR"});function c(){let g=+$("g").value||0,k=+$("kg").value||0,h=+$("h").value||0,w=+$("w").value||0,p=+$("kwh").value||0,m=Math.min(100,Math.max(0,+$("merma").value||0)),o=+$("otros").value||0,v=+$("venta").value||0,mat=g/1000*k*(1+m/100),el=h*w/1000*p,cost=mat+el+o,b=v-cost; $("material").textContent=e(mat);$("electricidad").textContent=e(el);$("coste").textContent=e(cost);$("beneficio").textContent=e(b);$("margen").textContent=(v?b/v*100:0).toLocaleString("es-ES",{minimumFractionDigits:1,maximumFractionDigits:1})+" %";$("hora").textContent=e(h?cost/h:0)+"/h"}ids.forEach(x=>$(x).addEventListener("input",c));$("reset").onclick=()=>{["25","20","2","130",".20","5","0","5"].forEach((v,i)=>$(ids[i]).value=v);c()};$("print").onclick=()=>print();c();
</script></body></html>
