<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora Bambu Lab A2L</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f1f1;margin:0;padding:16px;color:#222}
.contenedor{max-width:700px;margin:auto;background:white;padding:22px;border-radius:16px}
h1{margin:0 0 6px}.sub{color:#666;margin-bottom:20px}
.campo{margin-bottom:13px}.campo label{display:block;font-weight:bold;margin-bottom:5px}
.campo input{width:100%;box-sizing:border-box;padding:12px;font-size:18px;border:1px solid #aaa;border-radius:8px}
button{width:100%;padding:16px;margin-top:8px;background:#b00000;color:white;border:0;border-radius:9px;font-size:19px;font-weight:bold}
.resultados{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.resultado{padding:14px;background:#f5f5f5;border:1px solid #ddd;border-radius:9px}
.resultado span{display:block;color:#666;font-size:13px}
.resultado b{font-size:22px;display:block;margin-top:5px}
.beneficio{background:#fff0f0;border-color:#d99}
.beneficio b{color:#b00000}
@media(max-width:500px){.resultados{grid-template-columns:1fr}}
</style>
</head>

<body>
<div class="contenedor">
<h1>🖨️ Calculadora Bambu Lab A2L</h1>
<div class="sub">Rellena los datos y pulsa CALCULAR.</div>

<div class="campo">
<label>Filamento utilizado (gramos)</label>
<input id="gramos" type="number" value="25" step="0.1">
</div>

<div class="campo">
<label>Precio del filamento (€/kg)</label>
<input id="precio" type="number" value="20" step="0.01">
</div>

<div class="campo">
<label>Tiempo de impresión (horas)</label>
<input id="tiempo" type="number" value="2" step="0.01">
</div>

<div class="campo">
<label>Consumo medio de la A2L (W)</label>
<input id="consumo" type="number" value="130" step="1">
</div>

<div class="campo">
<label>Precio electricidad (€/kWh)</label>
<input id="luz" type="number" value="0.20" step="0.001">
</div>

<div class="campo">
<label>Merma (%)</label>
<input id="merma" type="number" value="5" step="0.1">
</div>

<div class="campo">
<label>Otros gastos (€)</label>
<input id="otros" type="number" value="0" step="0.01">
</div>

<div class="campo">
<label>Precio de venta (€)</label>
<input id="venta" type="number" value="5" step="0.01">
</div>

<button type="button" onclick="CALCULAR()">CALCULAR</button>

<div class="resultados">
<div class="resultado"><span>Coste material</span><b id="rMaterial">0,00 €</b></div>
<div class="resultado"><span>Coste electricidad</span><b id="rLuz">0,00 €</b></div>
<div class="resultado"><span>Coste total</span><b id="rCoste">0,00 €</b></div>
<div class="resultado beneficio"><span>BENEFICIO</span><b id="rBeneficio">0,00 €</b></div>
<div class="resultado"><span>Margen</span><b id="rMargen">0,00 %</b></div>
<div class="resultado"><span>Coste por hora</span><b id="rHora">0,00 €/h</b></div>
</div>
</div>

<script>
function NUMERO(id) {
    var valor = document.getElementById(id).value;
    valor = valor.replace(",", ".");
    var numero = parseFloat(valor);
    if (isNaN(numero) || numero < 0) return 0;
    return numero;
}

function EUROS(numero) {
    return numero.toFixed(2).replace(".", ",") + " €";
}

function CALCULAR() {

    var gramos = NUMERO("gramos");
    var precio = NUMERO("precio");
    var tiempo = NUMERO("tiempo");
    var consumo = NUMERO("consumo");
    var luz = NUMERO("luz");
    var merma = NUMERO("merma");
    var otros = NUMERO("otros");
    var venta = NUMERO("venta");

    var costeMaterial = (gramos / 1000) * precio;
    costeMaterial = costeMaterial * (1 + merma / 100);

    var costeElectricidad = (tiempo * consumo / 1000) * luz;

    var costeTotal = costeMaterial + costeElectricidad + otros;

    var beneficio = venta - costeTotal;

    var margen = 0;
    if (venta > 0) {
        margen = (beneficio / venta) * 100;
    }

    var costeHora = 0;
    if (tiempo > 0) {
        costeHora = costeTotal / tiempo;
    }

    document.getElementById("rMaterial").innerHTML = EUROS(costeMaterial);
    document.getElementById("rLuz").innerHTML = EUROS(costeElectricidad);
    document.getElementById("rCoste").innerHTML = EUROS(costeTotal);
    document.getElementById("rBeneficio").innerHTML = EUROS(beneficio);
    document.getElementById("rMargen").innerHTML = margen.toFixed(2).replace(".", ",") + " %";
    document.getElementById("rHora").innerHTML = EUROS(costeHora) + "/h";
}

CALCULAR();
</script>

</body>
</html>
